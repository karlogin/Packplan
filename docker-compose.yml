version: '3.8'

services:
  packplan:
    build: .
    container_name: packplan
    restart: unless-stopped
    ports:
      - "3847:3847"
    volumes:
      - ./data:/app/data
    environment:
      - PORT=3847
      - SYNC_TOKEN=${SYNC_TOKEN:-change-this-to-a-secret-token}
      - DATA_DIR=/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3847/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
